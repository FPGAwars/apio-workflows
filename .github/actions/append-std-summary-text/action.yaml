# Implementation of the append-std-summary-test action.

name: "Append Std Summary Text"
description: "Append to the summary text of the workflow the standard Apio release text."
inputs:
  output-file:
    description: File to append to
    required: true
    type: string
runs:
  using: "composite"
  steps:
    - name: Append summary text
      shell: bash
      run: |
        cat  >> ${{ inputs.output-file }} <<EOF

        ## Release guidelines

        - These guidelines apply to all the Apio repositories that have a daily build workflow. This
        include `fpgawars/apio`, `fpgawars/apio-vscode` and the Apio packages repos.

        - Releases are created daily with a `pre-release` status and are
        automatically deleted after 5 days, unless if set to be `stable`.

        - To make a pre-release stable, edit it manually and change its status from `Pre-release`
        to `None`.

        - The stable release in each Apio repo that is currently the one recommended
          for external users is marked as `latest`.

        - The workflow [Apio Repos Janitor](https://github.com/FPGAwars/apio/actions/workflows/apio-repos-janitor.yaml)
          which runs periodically flags in its job summary the releases that should be marked stable or latest.

        EOF

