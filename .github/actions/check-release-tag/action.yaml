name: Check release tag
description: >-
  Given a release tag, check that it has a valid yyyy-mm-dd values
  and that the date is in a reasonable range.
inputs:
  release-tag:
    description: Release tag (yyyy-mm-dd)
    required: true
    type: string
runs:
  using: "composite"
  steps:
    - name: Validate release-tag
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
      shell: bash
      run: |
        # Fail on first error
        set -euo pipefail

        # Announce the release tag we are going to check.
        echo "release-tag=$RELEASE_TAG"

        # Check for basic yyyy-mm-dd format.
        if [[ ! "$RELEASE_TAG" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          echo "release-tag must be yyyy-mm-dd" >&2
          exit 1
        fi

        echo "Passed yyyy-mm-dd check"

        # Check that the date is valid.
        if ! date -d "$RELEASE_TAG" +%F >/dev/null; then
          echo "release-tag $RELEASE_TAG is not a valid date" >&2
          exit 1
        fi

        echo "Passed valid date check"

        # Check for a reasonable range.
        if [[ "$RELEASE_TAG" < "2020-01-01" || "$RELEASE_TAG" > "2100-01-01" ]]; then
          echo "release-tag $RELEASE_TAG must be between 2020-01-01 and 2100-01-01" >&2
          exit 1
        fi

        echo "Passed date range check"

        echo "release-tag ok"
